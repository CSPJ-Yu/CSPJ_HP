<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Connect Spread PJ</title>

  <link rel="icon" href="/images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

  <!--
    Cloudflare Pagesのカスタム404ページ。トップ階層に404.htmlが存在しない場合、
    未知のパスが / へフォールバック(200)されてしまうため、それを防ぐために設置。
    CSPJ本体(/css/style.css /js/main.js)・/portal/・/dj/配下のいずれのCSS/JSも
    読み込まない、完全に独立した単一ファイル(スタイルはこのファイル内に完結)。
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-bg:     #0e0e0e;
      --color-text:   #e8e8e4;
      --color-muted:  #8a8a84;
      --color-accent: #c8c0a8;
      --color-border: #252525;

      --font-serif: 'Cormorant Garamond', 'Noto Serif JP', Georgia, serif;
      --font-sans:  'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .notfound {
      width: 100%;
      max-width: 32rem;
      padding: 2rem clamp(1.25rem, 6vw, 3rem);
      text-align: center;
    }

    .notfound__code {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: clamp(4rem, 18vw, 7rem);
      line-height: 1;
      color: var(--color-text);
      margin-bottom: 0.75rem;
    }

    .notfound__title {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 2rem;
    }

    .notfound__desc {
      font-family: var(--font-sans);
      font-weight: 300;
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 2.5rem;
    }

    .notfound__links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 20rem;
      margin: 0 auto;
    }

    .notfound__link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.75rem 1.5rem;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text);
      border: 1px solid var(--color-border);
      transition: border-color 0.25s ease, color 0.25s ease;
    }

    .notfound__link:hover,
    .notfound__link:focus-visible {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    a:focus-visible {
      outline: 1.5px solid var(--color-accent);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

  <main class="notfound">
    <p class="notfound__code" aria-hidden="true">404</p>
    <h1 class="notfound__title">Page Not Found</h1>
    <p class="notfound__desc">お探しのページは見つかりませんでした。</p>
    <nav class="notfound__links" aria-label="ページが見つからない場合のリンク">
      <a class="notfound__link" href="/">CSPJ HOME</a>
      <a class="notfound__link" href="/portal/">PORTAL</a>
      <a class="notfound__link" href="/privacy/">PRIVACY POLICY</a>
    </nav>
  </main>

</body>
</html>
