<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    公開ポータル(/dj/index.html)からはまだリンクしていない準備中ページのため、
    実データ・実素材が揃うまでの間、検索エンジンには一旦インデックスさせない。
    本番公開が確定したら削除すること。
  -->
  <meta name="robots" content="noindex">
  <meta name="description" content="YU-X 公式サイト（Connect Spread PJ制作）。準備中のセクションがあります。">
  <title>YU-X — Connect Spread PJ</title>

  <!--
    このページは /dj/yu-x/ 配下で完結する完全独立サイトです。
    CSPJ本体の /css/style.css / /js/main.js、DJポータルの /dj/style.css、
    および /dj/sample/ のCSS/JSは一切読み込みません。

    正式デザイン(Monochrome Editorial + Industrial + Digital Signal の
    ハイブリッド)。見出し用の太字書体としてInterのみ追加(欧文表示のみに
    使用。日本語文はOS標準フォントにフォールバックする)。
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!--
    CSPJ共通のデータ取得モジュール(データ取得のみ・HTML/CSSは含まない)。
    読み込み順に注意: utils.js → api-client.js → (各データモジュール、順不同)
    (schedule-data.jsの読み込み位置・内容は変更していない)
    詳細は /dj/README.md の「9. 公開API移行方針」を参照。
    2026-09時点でPROFILE / SCHEDULE / NEWS / SNS / POPUPの5機能すべてを
    公開API(api.cs-pj.com)へ接続済み。PROFILEはAPI側にBio/Genre/location/
    画像のカラムが存在しないため、display_nameのみAPIから取得する(script.js参照)。
  -->
  <script src="/dj/shared/js/utils.js"></script>
  <script src="/dj/shared/js/api-client.js"></script>
  <script src="/dj/shared/js/profile-data.js"></script>
  <script src="/dj/shared/js/schedule-data.js"></script>
  <script src="/dj/shared/js/news-data.js"></script>
  <script src="/dj/shared/js/social-data.js"></script>
  <script src="/dj/shared/js/popup-data.js"></script>
</head>
<body>

  <!-- キーボード操作者向けのスキップリンク。通常時は非表示、フォーカス時のみ表示。 -->
  <a class="skip-link" href="#main-content">本文へスキップ</a>

  <!--
    ページ最上部へのアンカー先。以前はこのidを .site-header 自体に付けていたが、
    ヘッダーは position:sticky のため、スクロール後は常にgetBoundingClientRect().top===0
    を返してしまい、ブラウザが「すでに先頭にある」と判断してTOPへスクロールしない
    不具合があった(左上のYU-Xロゴを押しても反応しない、という報告の原因)。
    sticky化されない、この高さ0の要素を専用のアンカー先にすることで解消する。
  -->
  <div id="top" aria-hidden="true"></div>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="#top" class="brand" data-dj-name>YU-X</a>
      <button class="nav-toggle" id="navToggle" aria-label="メニューを開く" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="siteNav">
        <a href="#profile">Profile</a>
        <a href="#news">News</a>
        <a href="#schedule">Schedule</a>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <section class="hero">
      <!-- Digital要素: 極めて控えめなsignal/waveform表現(装飾のみ、aria-hidden)。 -->
      <svg class="hero__signal" viewBox="0 0 800 70" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,35 L60,35 L80,10 L100,60 L120,35 L220,35 L240,18 L260,52 L280,35
                 L380,35 L400,8 L420,62 L440,35 L560,35 L580,20 L600,50 L620,35
                 L720,35 L740,15 L760,55 L780,35 L800,35" />
      </svg>

      <!-- 将来アーティスト写真を追加する場合: ここに
           <div class="hero__portrait"><img src="..." alt=""></div> を追加し、
           .hero に hero--photo クラスを付与する(style.css参照)。
           写真が無い現状はこのままで成立するレイアウトになっている。 -->

      <div class="hero__inner">
        <p class="hero__eyebrow">Connect Spread PJ Presents</p>
        <h1 class="hero__title" data-dj-name>YU-X</h1>
        <p class="hero__role">DJ<span class="hero__role-sep" aria-hidden="true">/</span>ARTIST</p>
        <!-- TODO(CSPJ): 正式なキャッチコピー/プロフィール文が届き次第、下記を差し替える -->
        <p class="hero__tagline">プロフィール準備中です。</p>
        <a href="#profile" class="hero__cta">Scroll ↓</a>
      </div>
    </section>

    <section id="profile" aria-labelledby="profile-heading">
      <div class="wrap">
        <h2 class="section-title" id="profile-heading">
          <span aria-hidden="true">01</span>Profile
        </h2>
        <!--
          PROFILE: 公開API接続済み(GET https://api.cs-pj.com/v1/djs/yu-x)。
          データ取得は /dj/shared/js/profile-data.js (CSPJProfile.fetchProfile)が担当し、
          このページ固有の描画(data-dj-name要素への反映)は script.js の initProfile() が
          担当する。

          【API側の制約】cspj-manage側のdjsテーブルには slug/display_name/status しか
          カラムが存在せず、公開APIも display_name しか返さない。Bio・Genre・location・
          プロフィール画像はAPI側にデータ自体が存在しないため、これらは今回も動的化して
          いない(推測して追加していない)。API側にカラム・endpointが追加された場合のみ
          対応すること。
        -->
        <div class="profile__grid">
          <!-- TODO(CSPJ): プロフィール写真が届き次第、この枠に <img> を差し込む
               (API側に画像フィールドが無いため、現状のローカル表示を維持している) -->
          <div class="profile__photo" aria-hidden="true"><span>PHOTO</span></div>
          <div class="profile__text">
            <!-- TODO(CSPJ): 正式なプロフィール文章(活動歴・得意ジャンル・出演実績など)が
                 API側に追加され次第、下記のプレースホルダーを差し替える -->
            <p>プロフィール情報を準備中です。</p>
          </div>
        </div>
      </div>
    </section>

    <section id="news" aria-labelledby="news-heading">
      <div class="wrap">
        <h2 class="section-title" id="news-heading">
          <span aria-hidden="true">02</span>News
        </h2>
        <!--
          NEWS一覧 — 公開API接続済み(GET https://api.cs-pj.com/v1/djs/yu-x/news)。
          データ取得・正規化は /dj/shared/js/news-data.js (CSPJNews.fetchNews) が
          担当し、このページ固有の描画は script.js の initNews() が担当する
          (責務分離)。画像あり/なし両方のitemに .news__item--with-image を
          付与して対応(下記CSS参照)。

          data-news-list はJSからの描画先コンテナ。0件・取得失敗時は、この
          静的なCome Soonプレースホルダーをそのまま維持する(script.js参照)。
        -->
        <div class="news__list" data-news-list>
          <p class="news__placeholder">Coming Soon</p>
        </div>
      </div>
    </section>

    <section id="schedule" aria-labelledby="schedule-heading">
      <div class="wrap">
        <h2 class="section-title" id="schedule-heading">
          <span aria-hidden="true">03</span>Schedule
        </h2>
        <!--
          初期表示は静的なプレースホルダー。JSでAPI取得に成功した場合のみ
          .schedule__list の中身を実データで置き換える。取得に失敗した場合は
          このプレースホルダーをそのまま維持する(script.js参照)。
        -->
        <ul class="schedule__list">
          <li class="schedule__placeholder">現在、出演予定情報を準備中です。</li>
        </ul>
      </div>
    </section>
  </main>

  <!--
    SNS LINKS: ページ下部のリンク領域として扱い、メインナビゲーションには含めない。
    公開API接続済み(GET https://api.cs-pj.com/v1/djs/yu-x/social-links)。
    データ取得・正規化は /dj/shared/js/social-data.js (CSPJSocialData.fetchSocialLinks)が
    担当し、このページ固有の描画(表示名マッピング・.social__indexへの差し込み)は
    script.js の initSocialLinks() が担当する(責務分離)。
    実際のservice値: instagram/x/tiktok/youtube/facebook/threads/other
    (cspj-manage側DBのCHECK制約と一致。SoundCloud/Mixcloud等は現時点で未対応)。
    「表示ON/OFF」の真偽値カラムはDBに存在せず、行が登録されていること自体が
    表示対象であることを意味する(APIがすでに絞り込み済み。フロント側で再フィルタしない)。
    0件・取得失敗時は、この静的なCome Soonプレースホルダーをそのまま維持する(script.js参照)。
  -->
  <section id="social" class="social" aria-labelledby="social-heading">
    <div class="wrap">
      <h2 class="section-title section-title--plain" id="social-heading">SNS</h2>
      <div class="social__list" data-social-list>
        <p class="social__placeholder">Coming Soon</p>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <!-- data-dj-name: 他の2箇所(ヘッダーロゴ / Heroタイトル)と同じくPROFILE API
         (display_name)から動的に反映する。取得できない場合は静的な「YU-X」を維持。 -->
    <p><span data-dj-name>YU-X</span> Official Page — Produced by Connect Spread PJ (CSPJ)</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
